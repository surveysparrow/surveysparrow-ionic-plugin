<ng-container *ngIf="node.slot && context.slots?.[node.slot] as tpl">
  <ng-container *ngTemplateOutlet="tpl"></ng-container>
</ng-container>

<ng-container *ngIf="!node.slot || !context.slots?.[node.slot]">
  <ng-container *ngIf="showNode && node.type === 'CloseButton'">
    <ss-close-button-embed [parentContext]="context"></ss-close-button-embed>
  </ng-container>

  <ng-container *ngIf="showNode && node.type === 'SpotCheckButton'">
    <ss-spotcheck-button-embed [parentContext]="context"></ss-spotcheck-button-embed>
  </ng-container>

  <ng-container *ngIf="showNode && node.type === 'WebViewRenderer'">
    <ss-webview-renderer [resolvedProps]="resolvedProps"></ss-webview-renderer>
  </ng-container>

  <ng-container *ngIf="showNode && node.type === 'SvgXml'">
    <span [innerHTML]="safeSvg(svgXmlContent)" [ngStyle]="domStyle"></span>
  </ng-container>

  <ng-container *ngIf="showNode && node.type === 'SafeAreaView'">
    <ss-animated-exit-wrapper
      *ngIf="hasExitOrLayoutAnimation()"
      [node]="node"
      [context]="context"
      [resolvedProps]="resolvedProps"
      [extraStyleRn]="safeAreaExtraRn"
    >
      <ss-builder-tree
        *ngFor="let ch of node.children || []; trackBy: trackByIndex"
        [node]="ch"
        [context]="context"
      ></ss-builder-tree>
    </ss-animated-exit-wrapper>
    <div
      *ngIf="!hasExitOrLayoutAnimation()"
      [ngStyle]="
        mergeStyles({
          paddingTop: 'env(safe-area-inset-top)',
          paddingBottom: 'env(safe-area-inset-bottom)',
          paddingLeft: 'env(safe-area-inset-left)',
          paddingRight: 'env(safe-area-inset-right)',
        })
      "
    >
      <ss-builder-tree
        *ngFor="let ch of node.children || []; trackBy: trackByIndex"
        [node]="ch"
        [context]="context"
      ></ss-builder-tree>
    </div>
  </ng-container>

  <ng-container *ngIf="showNode && node.type === 'View'">
    <ss-animated-exit-wrapper
      *ngIf="hasExitOrLayoutAnimation()"
      [node]="node"
      [context]="context"
      [resolvedProps]="resolvedProps"
    >
      <ss-builder-tree
        *ngFor="let ch of node.children || []; trackBy: trackByIndex"
        [node]="ch"
        [context]="context"
      ></ss-builder-tree>
    </ss-animated-exit-wrapper>
    <div *ngIf="!hasExitOrLayoutAnimation()" [ngStyle]="domStyle">
      <ss-builder-tree
        *ngFor="let ch of node.children || []; trackBy: trackByIndex"
        [node]="ch"
        [context]="context"
      ></ss-builder-tree>
    </div>
  </ng-container>

  <ng-container *ngIf="showNode && node.type === 'Text'">
    <span [ngStyle]="domStyle">
      <ng-container *ngIf="hasContentProp">{{ resolvedContent }}</ng-container>
      <ss-builder-tree
        *ngFor="let ch of node.children || []; trackBy: trackByIndex"
        [node]="ch"
        [context]="context"
      ></ss-builder-tree>
    </span>
  </ng-container>

  <ng-container *ngIf="showNode && node.type === 'Image'">
    <img [attr.alt]="''" [attr.src]="imageSrc" [ngStyle]="domStyle" />
  </ng-container>

  <ng-container
    *ngIf="showNode && (node.type === 'Pressable' || node.type === 'TouchableOpacity')"
  >
    <button type="button" [ngStyle]="domStyle" (click)="onPressableClick()">
      <ss-builder-tree
        *ngFor="let ch of node.children || []; trackBy: trackByIndex"
        [node]="ch"
        [context]="context"
      ></ss-builder-tree>
    </button>
  </ng-container>

  <ng-container *ngIf="showNode && !isKnownLayoutType()">
    <div [ngStyle]="domStyle" [attr.data-unknown-type]="node.type">
      <ss-builder-tree
        *ngFor="let ch of node.children || []; trackBy: trackByIndex"
        [node]="ch"
        [context]="context"
      ></ss-builder-tree>
    </div>
  </ng-container>
</ng-container>
